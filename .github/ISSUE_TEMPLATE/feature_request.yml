name: Feature request
description: 提出一个功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先描述问题，再描述你希望的方案。大的方向先讨论，不急着写代码。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便或做不到，什么场景会遇到。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 可以是一个具体设计，也可以只是期望的行为。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有配置、插件或工作流能否满足？为什么不够。
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 Issue 和文档。
          required: true
