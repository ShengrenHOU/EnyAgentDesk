name: verify-snapshot

on:
  push:
    branches: [main, 'release-candidate/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify snapshot provenance and immutable version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -gt 2 ]; then
            echo "a snapshot may only continue its public parent, without merging private history"
            exit 1
          fi
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then
            git merge-base --is-ancestor "$BEFORE" HEAD
          fi
          git log -1 --format=%B | grep -Eq '^Upstream-Commit: [0-9a-f]{40}$'
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "$GITHUB_REF_NAME" = main ]; then
            test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)"
          else
            test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          fi
          for path in GOAL.md docs/open-source docs/010-owner-pilot.md docs/011-development-principles.md; do
            if [ -e "$path" ]; then
              echo "forbidden path present: $path"
              exit 1
            fi
          done
          echo "snapshot provenance and version verified"
